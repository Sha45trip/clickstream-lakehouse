# --- YARN client mode: driver lives in the spark-client container, executors in the NodeManager
spark.master                          yarn
spark.submit.deployMode               client
spark.driver.host                     spark-client
spark.driver.bindAddress              0.0.0.0
spark.driver.port                     7078
spark.blockManager.port               7079

# --- Resources (fits inside yarn.nodemanager.resource.memory-mb = 5120)
spark.driver.memory                   1g
spark.yarn.am.memory                  512m
spark.executor.instances              2
spark.executor.cores                  1
spark.executor.memory                 1g
spark.sql.shuffle.partitions          16
spark.sql.adaptive.enabled            true

# --- Ship Spark jars from HDFS instead of re-uploading ~300 MB on every submit (done by `make init`)
spark.yarn.jars                       hdfs://namenode:8020/spark/jars/*

# --- Catalog / warehouse
spark.sql.catalogImplementation       hive
spark.sql.warehouse.dir               hdfs://namenode:8020/user/hive/warehouse
spark.sql.sources.partitionOverwriteMode   dynamic
spark.hadoop.hive.exec.dynamic.partition.mode   nonstrict
spark.sql.orc.compression.codec       zstd

# --- Event logs (for a Spark History Server later)
spark.eventLog.enabled                true
spark.eventLog.dir                    hdfs://namenode:8020/spark-logs
# Hive 3.1.3 metastore on Postgres can't push down DATE partition filters -> prune in Spark instead
spark.sql.hive.metastorePartitionPruningFallbackOnException   true
